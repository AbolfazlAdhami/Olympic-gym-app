<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title description">
  <title id="title">Olympic Gym — Persian fitness companion</title>
  <desc id="description">A dark charcoal and neon green project banner with the Olympic Gym app icon and exercise illustration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171b19"/>
      <stop offset="1" stop-color="#0d100f"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b7ff35"/>
      <stop offset="1" stop-color="#55c91c"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".38"/>
    </filter>
    <clipPath id="artClip"><rect x="760" y="65" width="360" height="350" rx="36"/></clipPath>
  </defs>
  <rect width="1200" height="480" rx="30" fill="url(#bg)"/>
  <circle cx="1080" cy="30" r="270" fill="#92e52e" opacity=".055"/>
  <circle cx="670" cy="480" r="300" fill="#92e52e" opacity=".035"/>
  <path d="M74 83h64" stroke="url(#glow)" stroke-width="6" stroke-linecap="round"/>
  <text x="74" y="155" fill="#b7ff35" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="7">PERSIAN FITNESS APP</text>
  <text x="70" y="245" fill="#f4f6f2" font-family="Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="1">OLYMPIC</text>
  <text x="74" y="305" fill="#f4f6f2" font-family="Arial, sans-serif" font-size="43" font-weight="700">GYM</text>
  <text x="74" y="364" fill="#aab2aa" font-family="Arial, sans-serif" font-size="23">Explore movements. Learn the form. Save your favorites.</text>
  <g filter="url(#shadow)">
    <rect x="760" y="65" width="360" height="350" rx="36" fill="#222723" stroke="#3b443d" stroke-width="2"/>
    <g clip-path="url(#artClip)">
      <rect x="760" y="65" width="360" height="350" fill="#f1f1ef"/>
      <image href="../apps/mobile/assets/images/0001-2gPfomN.jpg" x="780" y="92" width="320" height="250" preserveAspectRatio="xMidYMid meet"/>
      <rect x="780" y="350" width="320" height="44" rx="14" fill="#171b19"/>
      <circle cx="804" cy="372" r="8" fill="#a9f52d"/>
      <text x="824" y="379" fill="#f4f6f2" font-family="Arial, sans-serif" font-size="18" font-weight="700">EXERCISE LIBRARY</text>
    </g>
  </g>
  <image href="../apps/mobile/assets/icon.png" x="1040" y="22" width="112" height="112"/>
</svg>
