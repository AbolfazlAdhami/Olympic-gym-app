services:
  postgres:
    image: postgres:17
    container_name: gym-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gymapp
      POSTGRES_PASSWORD: gymapp
      POSTGRES_DB: gymapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: